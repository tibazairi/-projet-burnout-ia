name: CI/CD Pipeline - Burnout Prediction

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  ci-build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib mlflow

      - name: Verifier la syntaxe des scripts
        run: |
          python -m py_compile src/prep/prep.py
          python -m py_compile src/train/train.py
          python -m py_compile src/evaluate/evaluate.py
          python -m py_compile pipeline/pipeline.py
          python -m py_compile pipeline/run_pipeline.py

      - name: Test rapide de prep.py sur un echantillon
        run: |
          mkdir -p test_data test_out_train test_out_test
          python -c "
          import pandas as pd
          import numpy as np
          np.random.seed(0)
          n = 200
          df = pd.DataFrame({
              'Student_ID': range(n),
              'Major_Category': np.random.choice(['Humanities','Science','Business'], n),
              'Year_of_Study': np.random.choice(['Freshman','Sophomore','Junior','Senior'], n),
              'Pre_Semester_GPA': np.random.uniform(2,4,n),
              'Weekly_GenAI_Hours': np.random.uniform(0,30,n),
              'Primary_Use_Case': np.random.choice(['Copywriting/Drafting','Coding'], n),
              'Prompt_Engineering_Skill': np.random.choice(['Beginner','Intermediate','Advanced'], n),
              'Tool_Diversity': np.random.randint(1,5,n),
              'Paid_Subscription': np.random.choice([True, False], n),
              'Traditional_Study_Hours': np.random.uniform(0,20,n),
              'Perceived_AI_Dependency': np.random.randint(1,10,n),
              'Institutional_Policy': np.random.choice(['Allowed_With_Citation','Banned'], n),
              'Anxiety_Level_During_Exams': np.random.randint(1,10,n),
              'Post_Semester_GPA': np.random.uniform(2,4,n),
              'Skill_Retention_Score': np.random.uniform(0,100,n),
              'Burnout_Risk_Level': np.random.choice(['Low','Medium','High'], n),
          })
          df.to_csv('test_data/sample.csv', index=False)
          "
          python src/prep/prep.py --input_data test_data/sample.csv --train_output test_out_train --test_output test_out_test

      - name: Test rapide de train.py
        run: |
          mkdir -p test_out_model
          python src/train/train.py --train_data test_out_train --model_output test_out_model --n_estimators 10 --max_depth 3 --learning_rate 0.1 --subsample 0.8

      - name: Test rapide de evaluate.py
        run: |
          mkdir -p test_out_metrics
          python src/evaluate/evaluate.py --test_data test_out_test --model_input test_out_model --metrics_output test_out_metrics

      - name: CI reussie
        run: echo "Tous les scripts fonctionnent correctement."

  cd-deploy-to-azure:
    name: Deploy to Azure ML (self-hosted)
    needs: ci-build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Recuperer le code du repo
        uses: actions/checkout@v4

      - name: Verifier la session Azure CLI locale
        run: az account show

      - name: Installer les dependances Azure ML
        run: |
          D:\miniconda\envs\burnout_env\python.exe -m pip install --upgrade pip
          D:\miniconda\envs\burnout_env\python.exe -m pip install azure-ai-ml azure-identity pandas scikit-learn joblib mlflow

      - name: Lancer le pipeline Azure ML
        working-directory: pipeline
        run: D:\miniconda\envs\burnout_env\python.exe run_pipeline.py